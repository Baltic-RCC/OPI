[MAIN]
# Region the OPI assesses, defaults are Baltic RCC (CGM_BA = LT, LV, EE + PL)
# EMFOS merge type of the assessed models
MERGE_TYPE = BA
# Assessed areas, all must be in the model; their order sets the border labels (LT-LV, LV-EE, LT-PL)
ASSESSED_AREAS = LT,LV,EE
# Areas kept for realistic flows only: not outaged, not reconnected, not reported
EXTERNAL_AREAS = PL
# Area and region names in the model mapped to area codes, name:code
AREA_ALIASES = Estonia:EE,EESTI:EE,10YLV:LV
# TSO in the source model SSH file names per area, used to name the exported SSH files, area:TSO
AREA_TSO_NAMES = LT:LITGRID,LV:AST,EE:ELERING,PL:PSE
# Exported model file names, old:new
EXPORT_NAME_REPLACE = BALTICRCC-BA:BRCC-OPI
# UAP outages ignored by EIC and by name part
UAP_EXCLUDED_EICS = 10T-LT-RU-00001W,10T-LT-RU-00002U,10T-LT-RU-00003S,10T-LV-RU-00001A,10T-BY-LT-000053,10T-BY-LT-00001B,10T-BY-LT-000029,10T-EE-RU-00001M,10T-EE-RU-00002K,10T-EE-RU-00003I,10T-BY-LT-000045
UAP_EXCLUDED_NAMES = LitPol Link BTB
# Report: N-1 loading in % of the limit reported for lines and for 2W/3W transformers
LINE_LOADING_LIMIT = 105
TRANSFORMER_LOADING_LIMIT = 110
